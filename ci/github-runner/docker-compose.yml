services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      REPO: mjarring/training-planner
      ACCESS_TOKEN: ${GH_PAT_TRAINING_PLANNER}
      RUNNER_NAME: docker-runner
      RUNNER_LABELS: github-runner
    security_opt:
      - no-new-privileges:true
      # mja: Override the default seccomp here
      # to allow kcov to change personality.
      # I chose to blanket turn off syscall
      # filtering since this runner is expected
      # to only run on PRs pushed by me or a
      # trusted collaborator.
      - seccomp:unconfined
    cap_drop:
      - ALL
